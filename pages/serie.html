<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Detalhes, temporadas e episódios da série na NETFLIX 2%.">
  <title>NETFLIX 2% | Série</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#141414">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/serie.css">
  <script src="../js/theme.js" defer></script>
  <script src="../js/pwa.js" defer></script>
  <script src="../js/catalogo.js" defer></script>
  <script src="../js/serie.js" defer></script>
</head>
<body>
  <header class="series-topbar">
    <a class="brand" href="../index.html"><span class="brand-main">NETFLIX</span><span class="brand-mark">2%</span></a>
    <div class="series-header-actions">
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Ativar modo claro" title="Ativar modo claro" aria-pressed="false"><span class="theme-toggle-icon" aria-hidden="true">☾</span></button>
      <a class="back-link" href="../index.html">← Voltar ao início</a>
    </div>
  </header>

  <main id="seriesPage">
    <section class="series-hero" id="seriesHero">
      <div class="series-hero-overlay"></div>
      <div class="series-hero-content">
        <p class="series-kicker" id="seriesCategory">SÉRIE</p>
        <h1 id="seriesTitle">Carregando...</h1>
        <p class="series-description" id="seriesDescription"></p>
        <div class="series-meta" id="seriesMeta"></div>
        <button class="series-favorite-toggle" id="seriesFavoriteToggle" type="button" aria-pressed="false">♡ Adicionar aos favoritos</button>
      </div>
    </section>

    <section class="episodes-section">
      <div class="episodes-heading">
        <div>
          <p class="section-overline">EXPLORE O CONTEÚDO</p>
          <h2>Temporadas e episódios</h2>
        </div>
        <label class="season-picker">
          <span class="visually-hidden">Selecionar temporada</span>
          <select id="seasonSelect" aria-label="Selecionar temporada"></select>
        </label>
      </div>
      <div class="season-progress" id="seasonProgress" aria-live="polite">
        <div class="season-progress-copy"><strong id="seasonProgressLabel">Progresso da temporada</strong><span id="seasonProgressCount">0 de 0 episódios assistidos</span></div>
        <div class="season-progress-track" role="progressbar" id="seasonProgressBar" aria-label="Progresso da temporada" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="seasonProgressFill"></span></div>
      </div>

      <div class="episode-jump">
        <label for="episodeJumpInput">Ir para episódio</label>
        <div class="episode-jump-controls">
          <input id="episodeJumpInput" type="number" min="1" step="1" inputmode="numeric" placeholder="Ex.: 187">
          <button id="episodeJumpButton" type="button">IR</button>
        </div>
        <p class="episode-jump-feedback" id="episodeJumpFeedback" aria-live="polite"></p>
      </div>
      <div class="episode-sort-control">
        <span class="episode-sort-label">Ordem dos episódios</span>
        <button class="episode-sort-toggle" id="episodeSortToggle" type="button" data-order="asc" aria-label="Inverter ordem dos episódios" title="Inverter ordem dos episódios">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path class="sort-arrow sort-arrow-up" d="M8 18V6 M4.5 9.5 8 6l3.5 3.5" />
            <path class="sort-arrow sort-arrow-down is-active" d="M16 6v12 M12.5 14.5 16 18l3.5-3.5" />
          </svg>
        </button>
      </div>
      <div class="episode-list" id="episodeList" aria-live="polite"></div>
      <p class="episode-empty" id="episodeEmpty" hidden>Esta série ainda não possui episódios cadastrados.</p>
    </section>
  </main>

  <footer class="series-footer">
    <span>NETFLIX <b>2%</b></span>
    <small>© 2026 NETFLIX 2%. Projeto independente.</small>
  </footer>
</body>
</html>
